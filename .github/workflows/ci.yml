name: Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plate-pantry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, build, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_PLATE_PANTRY_BASE_PATH: /plate-pantry
      PLATE_PANTRY_PUBLIC_ORIGIN: https://jayro.dev
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install DMV backend dependencies
        run: npm ci --prefix backend --omit=dev
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Verify application
        run: npm run ci:test

  deploy:
    name: Publish jayro.dev/plate-pantry
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install deployment dependencies
        run: npm ci --no-audit --no-fund
      - name: Deploy the origin through Coolify
        run: npm run deploy:origin
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_ACCESS_CLIENT_ID: ${{ secrets.COOLIFY_ACCESS_CLIENT_ID }}
          COOLIFY_ACCESS_CLIENT_SECRET: ${{ secrets.COOLIFY_ACCESS_CLIENT_SECRET }}
      - name: Verify the origin
        run: npm run verify:production
        env:
          PLATE_PANTRY_VERIFY_URL: https://nypl8-origin.techn.is/plate-pantry
          PLATE_PANTRY_VERIFY_EDGE: '0'
      - name: Publish the Cloudflare edge route
        run: npm run deploy:edge -- --message "GitHub $GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify the public site and redirect
        run: npm run verify:production
